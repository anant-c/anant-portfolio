<svg width="370" height="370" viewBox="0 0 370 370" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="370" height="370" fill="#09090b" />
  <rect x="15" y="15" width="340" height="340" rx="12" stroke="#27272a" stroke-width="1.5" />
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#18181b" />
    </pattern>
    <linearGradient id="edge-in" x1="95" y1="175" x2="150" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="338" height="338" rx="11" fill="url(#dot-grid)" />

  <!-- cloud: Cloudflare edge -->
  <g id="edge">
    <rect x="35" y="150" width="60" height="50" rx="8" fill="#121215" stroke="#3f3f46" stroke-width="1.5" />
    <path d="M 50 183 h 30 a 8 8 0 0 0 0 -16 a 11 11 0 0 0 -21 -3 a 8 8 0 0 0 -9 19 z" stroke="#a1a1aa" stroke-width="1.2" fill="none" />
    <circle cx="95" cy="175" r="3" fill="#71717a" />
  </g>

  <!-- tunnel: outbound only -->
  <path d="M 95 175 L 150 175" stroke="url(#edge-in)" stroke-width="2" stroke-dasharray="4 3" fill="none" />
  <polygon points="140,171 146,175 140,179" fill="#10b981" />

  <!-- traefik: router -->
  <g id="router">
    <circle cx="180" cy="175" r="34" fill="#10b981" fill-opacity="0.06" />
    <rect x="150" y="145" width="60" height="60" rx="10" fill="#121215" stroke="#10b981" stroke-width="2" />
    <path d="M 168 175 h 24 M 185 166 l 9 9 l -9 9" stroke="#10b981" stroke-width="1.5" fill="none" />
    <circle cx="150" cy="175" r="3" fill="#10b981" />
    <circle cx="210" cy="175" r="3" fill="#10b981" />
  </g>

  <!-- three app containers -->
  <path d="M 210 175 C 235 175, 230 105, 255 105" stroke="#71717a" stroke-width="1.5" fill="none" />
  <path d="M 210 175 L 255 175" stroke="#71717a" stroke-width="1.5" fill="none" />
  <path d="M 210 175 C 235 175, 230 245, 255 245" stroke="#71717a" stroke-width="1.5" fill="none" />
  <g id="apps">
    <rect x="255" y="85" width="70" height="40" rx="8" fill="#121215" stroke="#71717a" stroke-width="1.5" />
    <rect x="268" y="98" width="44" height="14" rx="3" stroke="#d4d4d8" stroke-width="1.2" fill="none" />
    <rect x="255" y="155" width="70" height="40" rx="8" fill="#121215" stroke="#71717a" stroke-width="1.5" />
    <rect x="268" y="168" width="44" height="14" rx="3" stroke="#d4d4d8" stroke-width="1.2" fill="none" />
    <rect x="255" y="225" width="70" height="40" rx="8" fill="#121215" stroke="#71717a" stroke-width="1.5" />
    <rect x="268" y="238" width="44" height="14" rx="3" stroke="#d4d4d8" stroke-width="1.2" fill="none" />
  </g>

  <!-- shield: no open ports -->
  <path d="M 180 240 l 16 6 v 12 c 0 10 -7 16 -16 20 c -9 -4 -16 -10 -16 -20 v -12 z" stroke="#10b981" stroke-width="1.5" fill="none" />
  <path d="M 173 258 l 5 5 l 9 -10" stroke="#10b981" stroke-width="1.5" fill="none" />

  <text x="185" y="318" text-anchor="middle" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.25em">SHIP IT SAFE</text>
</svg>
