<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Cover for Core Storage Systems</title>
  <desc id="desc">An architectural blueprint graphic depicting a memory array connecting to a database storage tree.</desc>
  <rect width="640" height="360" fill="#0b0f19" />
  
  <!-- Blueprint Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232d42" stroke-width="1"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid)" />
  
  <!-- Title & Sub -->
  <text x="40" y="280" font-family="'IBM Plex Mono', monospace" font-size="32" font-weight="600" fill="#ffffff">Core Storage Systems</text>
  <text x="40" y="320" font-family="'IBM Plex Sans', sans-serif" font-size="20" fill="#9ca3af">Sample Talk · 2 Episodes</text>

  <!-- Graphic: Grid array and Tree -->
  <!-- Array -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="60" height="60" fill="none" stroke="#4285d7" stroke-width="4" rx="4"/>
    <rect x="70" y="0" width="60" height="60" fill="rgba(66, 133, 215, 0.2)" stroke="#4285d7" stroke-width="4" rx="4"/>
    <rect x="140" y="0" width="60" height="60" fill="none" stroke="#4285d7" stroke-width="4" rx="4"/>
  </g>
  
  <!-- Tree nodes -->
  <g transform="translate(380, 50)">
    <!-- Root -->
    <rect x="80" y="0" width="80" height="40" fill="none" stroke="#d1d5db" stroke-width="3" rx="4"/>
    <path d="M 120 40 L 40 100" fill="none" stroke="#4285d7" stroke-width="3" stroke-dasharray="6"/>
    <path d="M 120 40 L 200 100" fill="none" stroke="#4285d7" stroke-width="3" stroke-dasharray="6"/>
    <!-- Leaves -->
    <rect x="0" y="100" width="80" height="40" fill="rgba(66, 133, 215, 0.2)" stroke="#4285d7" stroke-width="3" rx="4"/>
    <rect x="160" y="100" width="80" height="40" fill="rgba(66, 133, 215, 0.2)" stroke="#4285d7" stroke-width="3" rx="4"/>
  </g>
  
  <!-- Connection -->
  <path d="M 210 110 C 290 110, 290 70, 370 70" fill="none" stroke="#4285d7" stroke-width="4" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4285d7"/>
    </marker>
  </defs>
</svg>
